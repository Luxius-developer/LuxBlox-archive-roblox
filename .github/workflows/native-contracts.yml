name: Check native Android modules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y liblz4-1 libxxhash0
      - run: bash tools/build_luau_compat.sh /tmp/luxblox-luau
      - name: Download the pinned previous APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-r7 --repo "$GITHUB_REPOSITORY" --pattern LuxBlox-r7.apk --dir /tmp/luxblox-input
      - run: python -m tools.verify_native_r8 /tmp/luxblox-input/LuxBlox-r7.apk --compiler /tmp/luxblox-luau/luau-compat
