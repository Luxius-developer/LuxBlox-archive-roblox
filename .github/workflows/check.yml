name: Check backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: luxblox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luxblox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LUXBLOX_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@localhost:5432/luxblox_test?sslmode=disable
      LUXBLOX_FEATURES_POSTGRES_URL: postgresql://postgres:local-ci-only@localhost:5432/luxblox_test?sslmode=disable
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

